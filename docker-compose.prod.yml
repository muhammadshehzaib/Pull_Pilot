# Production stack for the Contabo VPS. Everything binds to 127.0.0.1 —
# the host Nginx terminates TLS and proxies the two subdomains in.
# Secrets come from ./.env.prod (never committed): cp .env.prod.example .env.prod
services:
  postgres:
    image: postgres:15-alpine
    container_name: aipr-db
    environment:
      POSTGRES_USER: reviewer_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ai_reviewer_db
    volumes:
      - aipr_pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U reviewer_user -d ai_reviewer_db']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: aipr-redis
    # Without a volume the queue lives only in the container's writable layer, so a
    # recreate during deploy wipes every pending job while the Postgres row stays
    # QUEUED forever (nothing reaps it). /data is Redis's data dir.
    volumes:
      - aipr_redisdata:/data
    # appendonly writes every queue change to disk immediately, so a crash or power
    # cut cannot lose in-flight jobs. noeviction stops Redis from silently evicting
    # job keys under memory pressure.
    command: redis-server --appendonly yes --maxmemory-policy noeviction
    restart: unless-stopped

  backend:
    image: aipr-backend:local
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: aipr-backend
    user: '1000:1000'
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    cpus: '1.0'
    mem_limit: 1g
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment: &backend_environment
      NODE_ENV: production
      PORT: 4000
      BACKEND_URL: https://reviewerapi.shehzaib.com
      FRONTEND_URL: https://reviewer.shehzaib.com
      DATABASE_URL: postgresql://reviewer_user:${POSTGRES_PASSWORD}@postgres:5432/ai_reviewer_db
      REDIS_HOST: redis
      REDIS_PORT: 6379
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: 7d
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET}
      GITHUB_APP_ID: ${GITHUB_APP_ID}
      GITHUB_APP_SLUG: ${GITHUB_APP_SLUG:-pull-pilot-shehzaib}
      # Container-side path. The key is mounted in from ./secrets/ — see deploy/DEPLOY.md.
      GITHUB_APP_PRIVATE_KEY_PATH: /run/secrets/github-app.pem
      GITHUB_ACCESS_TOKEN: ${GITHUB_ACCESS_TOKEN}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET}
      BEHAVIORAL_OIDC_AUDIENCE: ${BEHAVIORAL_OIDC_AUDIENCE:-}
      # --- Polar billing (merchant of record) ---
      POLAR_ACCESS_TOKEN: ${POLAR_ACCESS_TOKEN}
      POLAR_WEBHOOK_SECRET: ${POLAR_WEBHOOK_SECRET}
      POLAR_SANDBOX: ${POLAR_SANDBOX:-false}
      POLAR_PRODUCT_INDIE_MONTHLY: ${POLAR_PRODUCT_INDIE_MONTHLY}
      POLAR_PRODUCT_INDIE_YEARLY: ${POLAR_PRODUCT_INDIE_YEARLY}
      POLAR_PRODUCT_TEAM_MONTHLY: ${POLAR_PRODUCT_TEAM_MONTHLY}
      POLAR_PRODUCT_TEAM_YEARLY: ${POLAR_PRODUCT_TEAM_YEARLY}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      CLAUDE_MODEL: claude-sonnet-4-6
      GROK_MODEL: ${GROK_MODEL:-meta-llama/llama-4-scout-17b-16e-instruct}
      GROK_BASE_URL: ${GROK_BASE_URL:-https://api.groq.com/openai/v1}
      REPO_POLL_INTERVAL_MS: ${REPO_POLL_INTERVAL_MS:-60000}
      REPO_POLL_ENABLED: ${REPO_POLL_ENABLED:-false}
      # --- Review context cache ---
      # 0 keeps cached code until its repository is disconnected. A positive
      # number of hours opts into automatic deletion. If you set this, set the
      # same value for NEXT_PUBLIC_CODE_RETENTION_HOURS on the web build: the
      # privacy policy publishes it as a fact.
      CONTEXT_RETENTION_HOURS: ${CONTEXT_RETENTION_HOURS:-0}
      CONTEXT_MAX_HOPS: ${CONTEXT_MAX_HOPS:-2}
      CONTEXT_MAX_FILES: ${CONTEXT_MAX_FILES:-25}
      CONTEXT_MAX_TOKENS: ${CONTEXT_MAX_TOKENS:-30000}
      CONTEXT_INDEX_MAX_FILES: ${CONTEXT_INDEX_MAX_FILES:-1000}
      CONTEXT_INDEX_MAX_DOWNLOADS: ${CONTEXT_INDEX_MAX_DOWNLOADS:-100}
      CONTEXT_INDEX_MAX_BYTES: ${CONTEXT_INDEX_MAX_BYTES:-10485760}
      CONTEXT_INDEX_TIMEOUT_MS: ${CONTEXT_INDEX_TIMEOUT_MS:-20000}
      CONTEXT_INDEX_CONCURRENCY: ${CONTEXT_INDEX_CONCURRENCY:-4}
    ports:
      - '127.0.0.1:8090:4000'
    # Mount the GitHub App private key read-only. Required for multi-tenant auth;
    # without it the backend silently falls back to the PAT below.
    volumes:
      - ./secrets/github-app.pem:/run/secrets/github-app.pem:ro
    restart: unless-stopped

    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 12

  worker:
    image: aipr-backend:local
    user: '1000:1000'
    command: ['node', 'dist/worker.js']
    environment: *backend_environment
    depends_on:
      backend:
        condition: service_healthy
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    cpus: '2.0'
    mem_limit: 2g
    volumes:
      - ./secrets/github-app.pem:/run/secrets/github-app.pem:ro
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_BACKEND_URL: https://reviewerapi.shehzaib.com
        # Self-hosted Umami. Leave both unset to ship no analytics at all.
        NEXT_PUBLIC_UMAMI_SRC: ${NEXT_PUBLIC_UMAMI_SRC:-}
        NEXT_PUBLIC_UMAMI_WEBSITE_ID: ${NEXT_PUBLIC_UMAMI_WEBSITE_ID:-}
        # Must match the backend's CONTEXT_RETENTION_HOURS.
        NEXT_PUBLIC_CODE_RETENTION_HOURS: ${CONTEXT_RETENTION_HOURS:-0}
    container_name: aipr-web
    depends_on:
      - backend
    ports:
      - '127.0.0.1:8091:3000'
    restart: unless-stopped

volumes:
  aipr_pgdata:
    name: aipr_aipr_pgdata
    external: true
  # Named explicitly so the queue data is stable no matter which directory the
  # repo is checked out in. Unlike aipr_pgdata this is not external — Docker
  # creates it on first `up`, so there is no manual step to miss.
  aipr_redisdata:
    name: aipr_redisdata
