# /etc/nginx/sites-available/reviewerapi.shehzaib.com
# Backend API + Socket.IO. certbot --nginx adds the TLS server block.
server {
    listen 80;
    server_name reviewerapi.shehzaib.com;

    # Matches the backend GitHub webhook parser's 25 MiB allowance.
    # Other backend JSON endpoints retain their own 100 KiB limit.
    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Socket.IO websocket upgrade
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
    }
}
